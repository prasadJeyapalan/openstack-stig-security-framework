[DEFAULT]
# Disable image import to prevent CVE-2024-32498 exploitation
# image_import_plugins = []

debug = False
log_file = /var/log/kolla/glance/glance-api.log
bind_host = 0.0.0.0
bind_port = 9292
workers = 8
registry_host = 192.168.100.11
registry_port = 9191
cinder_catalog_info = volumev3::internalURL

[database]
connection = mysql+pymysql://glance:PASSWORD@192.168.100.11:3306/glance
max_retries = -1

[keystone_authtoken]
www_authenticate_uri = http://192.168.100.11:5000
auth_url = http://192.168.100.11:5000
auth_type = password
project_domain_id = default
user_domain_id = default
project_name = service
username = glance
password = PASSWORD
memcache_security_strategy = ENCRYPT
memcache_secret_key = SECRET
memcached_servers = 192.168.100.11:11211

[paste_deploy]
flavor = keystone

[glance_store]
stores = file,http
default_store = file
filesystem_store_datadir = /var/lib/glance/images/

[image_format]
disk_formats = ami,ari,aki,vhd,vhdx,vmdk,raw,qcow2,vdi,iso,ploop

[image_import_opts]
# Image import functionality disabled for security
# Prevents CVE-2024-32498 exploitation through image import plugins

[oslo_middleware]
enable_proxy_headers_parsing = True

[oslo_policy]
policy_file = /etc/glance/policy.yaml

[cors]
allowed_origin = *
